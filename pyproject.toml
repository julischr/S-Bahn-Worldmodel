[project]
name = "s-bahn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "pytz>=2026.3.post1",
]

[project.scripts]
s-bahn = "s_bahn:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
